<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AI Learns to Drive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="carCanvas"></canvas>
    <div id="networkPanel">
        <canvas id="networkCanvas"></canvas>
        <div id="controlBar">
            <label for="mutationSlider" title="How far each new car's brain is nudged away from the saved one">Mutation</label>
            <input type="range" id="mutationSlider" min="0" max="1" step="0.01" value="0.2" title="How far each new car's brain is nudged away from the saved one">
            <output id="mutationValue" for="mutationSlider">0.20</output>
            <button id="resetButton" onclick="resetTraining()" title="Discard the saved brain and start training again from random cars">Reset</button>
        </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="banner" role="status" aria-live="polite">
        <div id="bannerTitle"></div>
        <div id="bannerDetail"></div>
    </div>
    <script src="visualizer.js"></script>
    <script src="network.js"></script>
    <script src="sensor.js"></script>
    <script src="utils.js"></script>
    <script src="road.js"></script>
    <script src="controls.js"></script>
    <script src="car.js"></script>
    <script src="main.js"></script>
</body>
</html>
