<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AI Learns to Drive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="carCanvas"></canvas>
    <div id="networkPanel">
        <canvas id="networkCanvas"></canvas>
        <div id="controlBar">
            <div class="controlRow">
                <label class="controlLabel" for="mutationSlider" title="Average size of the nudges a new car's brain gets (about 1 in 10 of its weights are nudged). Each generation tries a spread from tiny nudges up to twice this">Mutation</label>
                <input type="range" id="mutationSlider" min="0" max="1" step="0.01" value="0.4" title="Average size of the nudges a new car's brain gets (about 1 in 10 of its weights are nudged). Each generation tries a spread from tiny nudges up to twice this">
                <output id="mutationValue" for="mutationSlider">0.40</output>
            </div>
            <div class="controlRow">
                <span class="controlLabel" id="speedLabel" title="How fast the simulation runs. Game time speeds up with it, so finish times stay the same">Speed</span>
                <div id="speedOptions" role="radiogroup" aria-labelledby="speedLabel">
                    <input type="radio" name="speed" id="speed1" value="1" checked><label for="speed1">1×</label>
                    <input type="radio" name="speed" id="speed2" value="2"><label for="speed2">2×</label>
                    <input type="radio" name="speed" id="speed4" value="4"><label for="speed4">4×</label>
                </div>
                <button id="resetButton" onclick="resetTraining()" title="Discard the saved brain and start training again from random cars">Reset</button>
            </div>
        </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="banner" role="status" aria-live="polite">
        <div id="bannerTitle"></div>
        <div id="bannerDetail"></div>
    </div>
    <script src="visualizer.js"></script>
    <script src="network.js"></script>
    <script src="sensor.js"></script>
    <script src="utils.js"></script>
    <script src="road.js"></script>
    <script src="controls.js"></script>
    <script src="car.js"></script>
    <script src="main.js"></script>
</body>
</html>
